# Archive, sign, and upload Kage Loop to TestFlight on every push to develop,
# or by hand from the Actions tab. Uploading never submits for review; that
# stays a manual step in App Store Connect.
name: TestFlight

on:
  push:
    branches: [develop]
    # Docs-only pushes don't change the app, so they shouldn't spend a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - "submissions/**"
      - "AGENTS.md"
      - "PLAN.md"
      - "CLAUDE.md"
  workflow_dispatch:
    inputs:
      allow_auto_signing:
        description: "Fallback: let Xcode create certificates/profiles (uses up Apple's certificate quota)"
        type: boolean
        default: false

permissions:
  contents: read

# One upload at a time, and never cancel one halfway through.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Build numbers only ever go up: this run's number, offset past the
      # builds uploaded before this workflow existed (1.3 was build 4).
      # Raise the BUILD_NUMBER_OFFSET repository variable if App Store
      # Connect ever rejects a number as already used.
      - name: Choose build number
        env:
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '4' }}
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + OFFSET ))" >> "$GITHUB_ENV"

      # Automatic signing stores the certificate it fetches in the default
      # keychain; give it a fresh, unlocked one that disappears with the runner.
      - name: Create keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"

      # Fixed signing: one stable Apple Distribution certificate and one App
      # Store provisioning profile, stored as secrets. Nothing is created.
      - name: Install signing certificate and profile
        if: ${{ !inputs.allow_auto_signing }}
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: scripts/ci/install-signing.sh

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Push runs have no inputs, so they sign manually too.
          SIGNING: ${{ inputs.allow_auto_signing && 'automatic' || 'manual' }}
        run: scripts/ci/testflight.sh

      - name: Remove keychain and profile
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/kageloop-ci.mobileprovision"

      - name: Summary
        run: echo "Uploaded build $BUILD_NUMBER. Check TestFlight in App Store Connect once processing finishes." >> "$GITHUB_STEP_SUMMARY"
